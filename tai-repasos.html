<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAI — Panel de Repasos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F3F4F7;
  --panel:#FFFFFF;
  --panel-alt:#F7F8FA;
  --border:#DEE2E9;
  --text:#1B2130;
  --text-muted:#5B6472;
  --text-faint:#8991A0;
  --accent-blue:#2E5FE0;
  --accent-green:#1E9E63;
  --accent-amber:#B9791A;
  --accent-red:#C43D34;
  --green-bg:#E5F5EC;
  --amber-bg:#FBF0DE;
  --red-bg:#FBE7E5;
  --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --radius:10px;
  --shadow:0 1px 2px rgba(20,24,34,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141B;
    --panel:#171C24;
    --panel-alt:#1C222C;
    --border:#2A313E;
    --text:#E7EAF0;
    --text-muted:#98A1B3;
    --text-faint:#6A7284;
    --accent-blue:#5B8DFF;
    --accent-green:#39C77E;
    --accent-amber:#E3A63D;
    --accent-red:#EA5B52;
    --green-bg:#12291F;
    --amber-bg:#2B2313;
    --red-bg:#301917;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#10141B;
  --panel:#171C24;
  --panel-alt:#1C222C;
  --border:#2A313E;
  --text:#E7EAF0;
  --text-muted:#98A1B3;
  --text-faint:#6A7284;
  --accent-blue:#5B8DFF;
  --accent-green:#39C77E;
  --accent-amber:#E3A63D;
  --accent-red:#EA5B52;
  --green-bg:#12291F;
  --amber-bg:#2B2313;
  --red-bg:#301917;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-blue);color:#fff;}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

.mono{font-family:var(--font-mono);}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;font-size:inherit;}

/* ============ LAYOUT ============ */
.shell{max-width:1180px;margin:0 auto;padding:20px 18px 64px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding-bottom:16px;margin-bottom:18px;
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand-mark{
  font-family:var(--font-mono);font-weight:700;font-size:13px;letter-spacing:.04em;
  color:var(--accent-blue);border:1px solid var(--border);border-radius:6px;padding:3px 7px;
}
.brand h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.clock{font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted);text-align:right;line-height:1.35;}
.clock b{color:var(--text);font-weight:600;}

.theme-toggle{
  background:none;border:1px solid var(--border);border-radius:7px;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);
}
.theme-toggle:hover{border-color:var(--accent-blue);color:var(--accent-blue);}

nav.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);overflow-x:auto;}
nav.tabs button{
  background:none;border:none;padding:9px 13px;color:var(--text-muted);
  font-size:13.5px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
nav.tabs button:hover{color:var(--text);}
nav.tabs button.active{color:var(--accent-blue);border-bottom-color:var(--accent-blue);}

.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.panel + .panel{margin-top:16px;}
.panel-pad{padding:18px 20px;}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 20px;border-bottom:1px solid var(--border);
}
.panel-head h2{font-size:13.5px;font-weight:600;margin:0;}
.panel-head .sub{font-size:12px;color:var(--text-faint);margin-top:2px;}

.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-stats{grid-template-columns:repeat(4,1fr);}
@media (max-width:760px){.grid-2{grid-template-columns:1fr;}.grid-stats{grid-template-columns:repeat(2,1fr);}}

/* ============ STAT CARDS ============ */
.stat-card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);
}
.stat-card .n{font-family:var(--font-mono);font-size:26px;font-weight:600;line-height:1;}
.stat-card .l{font-size:12px;color:var(--text-muted);margin-top:6px;}
.stat-card.red .n{color:var(--accent-red);}
.stat-card.amber .n{color:var(--accent-amber);}
.stat-card.green .n{color:var(--accent-green);}

/* ============ SEMAPHORE ============ */
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}
.dot.red{background:var(--accent-red);}
.dot.amber{background:var(--accent-amber);}
.dot.green{background:var(--accent-green);}
.dot.gray{background:var(--text-faint);}

.bloque-group{margin-bottom:4px;}
.bloque-title{
  font-size:11.5px;font-weight:600;color:var(--text-faint);text-transform:uppercase;
  letter-spacing:.06em;padding:12px 20px 6px;
}
.tema-row{
  display:flex;align-items:center;gap:12px;padding:9px 20px;
  border-top:1px solid var(--border);
}
.tema-row:hover{background:var(--panel-alt);}
.tema-num{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);width:22px;flex-shrink:0;}
.tema-title{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tema-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);flex-shrink:0;}
.tema-meta.red{color:var(--accent-red);}
.tema-meta.amber{color:var(--accent-amber);}
.tema-meta.green{color:var(--accent-green);}
.badge-nivel{
  font-family:var(--font-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;
  border:1px solid var(--border);color:var(--text-muted);flex-shrink:0;
}

/* ============ HERO / MODULO B ============ */
.hero-card{
  background:linear-gradient(180deg,var(--panel) 0%, var(--panel-alt) 100%);
  border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);
}
.hero-eyebrow{font-size:12px;color:var(--text-muted);margin-bottom:8px;}
.hero-title{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px;}
.hero-row{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;}
.hero-metric{}
.hero-metric .v{font-family:var(--font-mono);font-size:17px;font-weight:600;}
.hero-metric .k{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.hero-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}

.btn{
  border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{background:var(--accent-blue);color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:none;border-color:var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--accent-blue);color:var(--accent-blue);}
.btn-danger{background:none;border-color:var(--border);color:var(--accent-red);}
.btn-danger:hover{border-color:var(--accent-red);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-sm{padding:5px 10px;font-size:12px;}

/* ============ FORMS ============ */
label.field{display:block;margin-bottom:12px;}
label.field span{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;font-weight:500;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;
  padding:8px 10px;color:var(--text);
}
textarea{resize:vertical;min-height:80px;}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent-blue);}
.checkbox-line{display:flex;align-items:center;gap:10px;font-size:13.5px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--text-faint);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}

.empty{padding:40px 20px;text-align:center;color:var(--text-muted);}
.empty .big{font-size:28px;margin-bottom:8px;}

.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--border);color:var(--text-muted);}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;
  font-size:13px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50;
  opacity:0;pointer-events:none;transition:opacity .15s ease, transform .15s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.log-item{padding:10px 0;border-top:1px solid var(--border);}
.log-item:first-child{border-top:none;}
.log-item .meta{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-bottom:3px;}
.log-item .txt{font-size:13px;white-space:pre-wrap;}

.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.chip{background:var(--panel-alt);border:1px solid var(--border);border-radius:5px;padding:4px 8px;font-size:12px;}

.day-select{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.day-select button{
  background:var(--panel);border:1px solid var(--border);border-radius:7px;
  padding:7px 12px;font-size:12.5px;color:var(--text-muted);font-weight:500;
}
.day-select button.active{border-color:var(--accent-blue);color:var(--accent-blue);background:var(--panel-alt);}

.section-note{font-size:12px;color:var(--text-faint);margin-top:6px;}

@media (max-width:600px){
  .shell{padding:14px 12px 48px;}
  .topbar{flex-wrap:wrap;}
  .grid-stats{grid-template-columns:1fr 1fr;}
  .tema-title{white-space:normal;}
}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">TAI</span>
      <h1>Panel de Repasos</h1>
    </div>
    <div class="topbar-right">
      <div class="clock mono" id="clockBox"></div>
      <button class="theme-toggle" id="themeToggle" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="hoy">Hoy</button>
    <button data-tab="dia5">5º día</button>
    <button data-tab="historial">Historial</button>
    <button data-tab="temario">Temario</button>
  </nav>

  <div id="view"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ================== CONFIG ================== */
var UMBRAL = {1:12, 2:25, 3:40, 4:40}; // días sin repasar antes de alerta roja, por nivel
var BLOQUES = ["Bloque I","Bloque II","Bloque III","Bloque IV"];
var DIA_BLOQUES = {
  1: ["Bloque I","Bloque III"],   // Lunes
  2: ["Bloque II","Bloque I"],    // Martes
  3: ["Bloque III","Bloque IV"],  // Miércoles
  4: ["Bloque IV","Bloque II"],   // Jueves
  5: "GLOBAL",                    // Viernes / 5º día
  6: "GLOBAL",
  0: "GLOBAL"
};
var DIA_NOMBRES = {1:"Lunes",2:"Martes",3:"Miércoles",4:"Jueves",5:"Viernes (5º día)",6:"Sábado",0:"Domingo"};

var LS_TEMAS = "tai_temas";
var LS_MACRO = "tai_macro_repasos";
var LS_LOG = "tai_daily_log";
var LS_THEME = "tai_theme";

/* ================== STATE ================== */
var state = {
  temas: loadJSON(LS_TEMAS, []),
  macro: loadJSON(LS_MACRO, []),
  log: loadJSON(LS_LOG, {}),        // { "YYYY-MM-DD": { moduloA:bool, moduloC:[{tema_numero,tema_titulo,texto,ts}] } }
  tab: "dashboard",
  diaOverride: null                 // permite forzar día distinto al real
};

function loadJSON(key, fallback){
  try{
    var raw = localStorage.getItem(key);
    if(!raw) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function save(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function saveTemas(){ save(LS_TEMAS, state.temas); }
function saveMacro(){ save(LS_MACRO, state.macro); }
function saveLog(){ save(LS_LOG, state.log); }

/* ================== HELPERS ================== */
function todayISO(){
  var d = new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function pad(n){ return n<10 ? "0"+n : ""+n; }
function daysBetween(iso1, iso2){
  if(!iso1) return Infinity;
  var a = new Date(iso1+"T00:00:00");
  var b = new Date(iso2+"T00:00:00");
  return Math.round((b-a)/86400000);
}
function fmtDate(iso){
  if(!iso) return "—";
  var p = iso.split("-");
  return p[2]+"/"+p[1]+"/"+p[0];
}
function nivelLabel(n){
  return {1:"N1 · Crítico",2:"N2 · Ágil",3:"N3 · Base",4:"N4 · Periférico"}[n] || ("N"+n);
}
function estadoTema(t, hoy){
  hoy = hoy || todayISO();
  var dias = daysBetween(t.fecha_ultimo_repaso, hoy);
  var umbral = UMBRAL[t.nivel_prioridad] || 30;
  if(!t.fecha_ultimo_repaso) return {color:"red", dias: dias, umbral: umbral};
  if(dias >= umbral) return {color:"red", dias:dias, umbral:umbral};
  if(dias >= umbral*0.65) return {color:"amber", dias:dias, umbral:umbral};
  return {color:"green", dias:dias, umbral:umbral};
}
function diaActual(){
  if(state.diaOverride !== null) return state.diaOverride;
  return new Date().getDay();
}
function bloquesDelDia(dia){
  return DIA_BLOQUES[dia];
}
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove("show"); }, 2200);
}
function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for(var k in attrs){
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else if(k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){
    if(typeof c === "string") e.appendChild(document.createTextNode(c));
    else if(c) e.appendChild(c);
  });
  return e;
}

/* ================== ALGORITMO RECOMENDADOR (Módulo B) ================== */
function candidatosDelDia(dia){
  var bloques = bloquesDelDia(dia);
  var pool = state.temas.filter(function(t){
    if(!t.estudiado) return false;
    if(bloques === "GLOBAL") return true;
    return bloques.indexOf(t.bloque) !== -1;
  });
  return pool;
}
function recomendarTema(dia){
  var hoy = todayISO();
  var pool = candidatosDelDia(dia).filter(function(t){
    return t.nivel_prioridad === 1 || t.nivel_prioridad === 2;
  });
  var urgentes = pool.filter(function(t){
    var e = estadoTema(t, hoy);
    return e.dias >= e.umbral;
  });
  var origen = urgentes.length ? urgentes : pool;
  if(!origen.length) return null;
  origen = origen.slice().sort(function(a,b){
    var da = daysBetween(a.fecha_ultimo_repaso, hoy);
    var db = daysBetween(b.fecha_ultimo_repaso, hoy);
    if(db !== da) return db - da; // mayor días primero
    var pa = (a.ultimo_porcentaje_test == null) ? -1 : a.ultimo_porcentaje_test;
    var pb = (b.ultimo_porcentaje_test == null) ? -1 : b.ultimo_porcentaje_test;
    return pa - pb; // menor porcentaje primero
  });
  return {tema: origen[0], urgente: urgentes.length > 0, alternativos: origen.slice(1,4)};
}

/* ================== RENDER: TABS ================== */
document.getElementById("tabs").addEventListener("click", function(ev){
  var b = ev.target.closest("button[data-tab]");
  if(!b) return;
  state.tab = b.getAttribute("data-tab");
  document.querySelectorAll("#tabs button").forEach(function(x){ x.classList.toggle("active", x===b); });
  render();
});

/* ================== RENDER: DASHBOARD ================== */
function renderDashboard(){
  var hoy = todayISO();
  var studied = state.temas.filter(function(t){ return t.estudiado; });
  var counts = {red:0, amber:0, green:0};
  studied.forEach(function(t){ counts[estadoTema(t,hoy).color]++; });

  var wrap = el("div");

  var stats = el("div", {class:"grid grid-stats"}, [
    statCard(counts.red, "Repaso urgente", "red"),
    statCard(counts.amber, "En plazo", "amber"),
    statCard(counts.green, "Al día", "green"),
    statCard(studied.length, "Temas estudiados", "")
  ]);
  wrap.appendChild(stats);

  var panel = el("div", {class:"panel"});
  panel.appendChild(el("div", {class:"panel-head"}, [
    el("div", {}, [
      el("h2", {}, ["Semáforo por bloque"]),
      el("div", {class:"sub"}, ["Umbral: Nivel 1 > 12 días · Nivel 2 > 25 días · Nivel 3/4 > 40 días"])
    ])
  ]));

  if(!studied.length){
    panel.appendChild(el("div", {class:"empty"}, [
      el("div", {class:"big"}, ["◌"]),
      el("div", {}, ["No hay temas marcados como estudiados todavía."]),
      el("div", {class:"section-note"}, ["Importa tu Temarios_JSON.json desde la pestaña Temario."])
    ]));
  } else {
    BLOQUES.forEach(function(bloque){
      var temas = studied.filter(function(t){ return t.bloque === bloque; })
        .sort(function(a,b){
          var ea = estadoTema(a,hoy), eb = estadoTema(b,hoy);
          var rank = {red:0, amber:1, green:2};
          if(rank[ea.color] !== rank[eb.color]) return rank[ea.color]-rank[eb.color];
          return eb.dias - ea.dias;
        });
      if(!temas.length) return;
      panel.appendChild(el("div", {class:"bloque-title"}, [bloque]));
      temas.forEach(function(t){
        var e = estadoTema(t, hoy);
        panel.appendChild(el("div", {class:"tema-row"}, [
          el("span", {class:"dot "+e.color}),
          el("span", {class:"tema-num mono"}, [String(t.numero).padStart ? String(t.numero) : String(t.numero)]),
          el("span", {class:"tema-title"}, [t.titulo]),
          el("span", {class:"badge-nivel"}, ["N"+t.nivel_prioridad]),
          el("span", {class:"tema-meta mono "+e.color}, [
            (e.dias===Infinity ? "sin repasar" : e.dias+"d") + " · " + (t.ultimo_porcentaje_test!=null ? t.ultimo_porcentaje_test+"%" : "—")
          ])
        ]));
      });
    });
  }
  wrap.appendChild(panel);
  return wrap;
}
function statCard(n, label, tone){
  return el("div", {class:"stat-card "+(tone||"")}, [
    el("div", {class:"n mono"}, [String(n)]),
    el("div", {class:"l"}, [label])
  ]);
}

/* ================== RENDER: HOY (A/B/C) ================== */
function renderHoy(){
  var wrap = el("div");
  var dia = diaActual();
  var bloques = bloquesDelDia(dia);

  var daySelect = el("div", {class:"day-select"});
  [1,2,3,4,5].forEach(function(d){
    var btn = el("button", {
      class: (dia===d ? "active":""),
      onclick: function(){ state.diaOverride = d; render(); }
    }, [DIA_NOMBRES[d]]);
    daySelect.appendChild(btn);
  });
  daySelect.appendChild(el("button", {
    class: (state.diaOverride===null ? "active":""),
    onclick: function(){ state.diaOverride = null; render(); }
  }, ["Usar hoy real"]));
  wrap.appendChild(daySelect);

  var logHoy = state.log[todayISO()] || {moduloA:false, moduloC:[]};

  // ---- Módulo A ----
  var panelA = el("div", {class:"panel panel-pad"});
  panelA.appendChild(el("div", {class:"checkbox-line"}, [
    (function(){
      var cb = el("input", {type:"checkbox"});
      cb.checked = !!logHoy.moduloA;
      cb.addEventListener("change", function(){
        var d = todayISO();
        if(!state.log[d]) state.log[d] = {moduloA:false, moduloC:[]};
        state.log[d].moduloA = cb.checked;
        saveLog();
        toast(cb.checked ? "Módulo A completado" : "Módulo A desmarcado");
      });
      return cb;
    })(),
    el("span", {}, [el("b",{},["Módulo A · Barrido Anki"]), " — 30 min. Confirma el barrido de tarjetas ejecutado hoy."])
  ]));
  wrap.appendChild(panelA);

  // ---- Módulo B ----
  var rec = recomendarTema(dia);
  var hero = el("div", {class:"hero-card"});
  hero.appendChild(el("div", {class:"hero-eyebrow"}, [

  ]));
  if(!rec){
    hero.appendChild(el("div", {class:"hero-title"}, ["Sin candidatos para hoy"]));

    hero.appendChild(el("div", {class:"hero-title"}, ["Tema "+t.numero+" — "+t.titulo]));

      el("div", {class:"hero-metric"}, [el("div",{class:"v mono"},[e.dias===Infinity?"—":e.dias+"d"]), el("div",{class:"k"},["desde el último repaso"])]),
      el("div", {class:"hero-metric"}, [el("div",{class:"v mono"},[String(e.umbral)+"d"]), el("div",{class:"k"},["umbral de alerta"])]),
      el("div", {class:"hero-metric"}, [el("div",{class:"v mono"},[t.ultimo_porcentaje_test!=null?t.ultimo_porcentaje_test+"%":"—"]), el("div",{class:"k"},["último test"])]),
      el("div", {class:"hero-metric"}, [el("div",{class:"v mono"},[fmtDate(t.fecha_ultimo_repaso)]), el("div",{class:"k"},["fecha último repaso"])])
    ]));

    actions.appendChild(el("button", {class:"btn btn-primary", onclick:function(){ completarRepaso(t); }}, ["Completar repaso"]));
    hero.appendChild(actions);

  }
  wrap.appendChild(hero);

  // ---- Módulo C ----
  var panelC = el("div", {class:"panel"});
  panelC.appendChild(el("div", {class:"panel-head"}, [
    el("div", {}, [el("h2",{},["Módulo C · Cuaderno de errores"]), el("div",{class:"sub"},["30 min — registra fallos y tarjetas reescritas de hoy"])])
  ]));
  var formC = el("div", {class:"panel-pad"});
  var selTema = el("select", {}, [el("option", {value:""}, ["— sin tema asociado —"])].concat(
    state.temas.filter(function(t){return t.estudiado;}).map(function(t){
      return el("option", {value:t.numero}, ["T"+t.numero+" — "+t.titulo]);
    })
  ));
  var txtC = el("textarea", {placeholder:"Describe el error, concepto a repasar o la tarjeta reescrita..."});
  formC.appendChild(el("label", {class:"field"}, [el("span",{},["Tema relacionado"]), selTema]));
  formC.appendChild(el("label", {class:"field"}, [el("span",{},["Anotación"]), txtC]));
  formC.appendChild(el("button", {class:"btn btn-primary", onclick:function(){
    if(!txtC.value.trim()) return;
    var d = todayISO();
    if(!state.log[d]) state.log[d] = {moduloA:false, moduloC:[]};
    var numero = selTema.value ? parseInt(selTema.value,10) : null;
    var temaObj = numero ? state.temas.find(function(t){return t.numero===numero;}) : null;
    var entry = {tema_numero:numero, tema_titulo: temaObj?temaObj.titulo:null, texto:txtC.value.trim(), ts:new Date().toISOString()};
    state.log[d].moduloC.push(entry);
    saveLog();
    if(temaObj){
      temaObj.cuaderno_errores = temaObj.cuaderno_errores || [];
      temaObj.cuaderno_errores.push(txtC.value.trim());
      saveTemas();
    }
    txtC.value = "";
    toast("Anotación guardada");
    render();
  }}, ["Guardar anotación"]));
  panelC.appendChild(formC);

  if(logHoy.moduloC && logHoy.moduloC.length){
    var logList = el("div", {class:"panel-pad", style:""});
    logHoy.moduloC.slice().reverse().forEach(function(entry){
      logList.appendChild(el("div", {class:"log-item"}, [
        el("div", {class:"meta"}, [(entry.tema_numero?("T"+entry.tema_numero+" — "+entry.tema_titulo):"General") + " · " + new Date(entry.ts).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})]),
        el("div", {class:"txt"}, [entry.texto])
      ]));
    });
    panelC.appendChild(el("div", {class:"panel-head"}, [el("h2",{},["Hoy"])]));
    panelC.appendChild(logList);
  }
  wrap.appendChild(panelC);

  return wrap;
}

function completarRepaso(t){
  var pctStr = prompt("Puntuación del test de repaso para \"T"+t.numero+" — "+t.titulo+"\" (opcional, %):", t.ultimo_porcentaje_test != null ? t.ultimo_porcentaje_test : "");
  t.fecha_ultimo_repaso = todayISO();
  if(pctStr !== null && pctStr.trim() !== "" && !isNaN(parseFloat(pctStr))){
    t.ultimo_porcentaje_test = Math.max(0, Math.min(100, parseFloat(pctStr)));
  }
  saveTemas();
  toast("Repaso registrado para T"+t.numero);
  render();
}

    el("div", {}, [el("h2",{},["Histórico de aciertos · Test del 5º día"])])
  ]));

function buildLineChart(data){
  var w = 900, h = 260, padL = 40, padR = 16, padT = 16, padB = 30;
  var innerW = w - padL - padR, innerH = h - padT - padB;
  var maxY = 100, minY = 0;
  var n = data.length;
  var pts = data.map(function(d,i){
    var x = n===1 ? padL + innerW/2 : padL + (i/(n-1))*innerW;
    var y = padT + innerH - ((d.porcentaje-minY)/(maxY-minY))*innerH;
    return {x:x, y:y, d:d};
  });
  var pathD = pts.map(function(p,i){ return (i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1); }).join(" ");

  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 "+w+" "+h);
  svg.setAttribute("width", "100%");
  svg.style.overflow = "visible";

  var gridColor = getComputedStyle(document.body).getPropertyValue('--border').trim() || "#ccc";
  [0,25,50,75,100].forEach(function(v){
    var y = padT + innerH - (v/100)*innerH;
    var line = document.createElementNS(svgNS,"line");
    line.setAttribute("x1", padL); line.setAttribute("x2", w-padR);
    line.setAttribute("y1", y); line.setAttribute("y2", y);
    line.setAttribute("stroke", gridColor); line.setAttribute("stroke-width","1");
    svg.appendChild(line);
    var txt = document.createElementNS(svgNS,"text");
    txt.setAttribute("x", 6); txt.setAttribute("y", y+4);
    txt.setAttribute("font-size","10"); txt.setAttribute("fill","currentColor");
    txt.setAttribute("opacity","0.55");
    txt.setAttribute("font-family","IBM Plex Mono, monospace");
    txt.textContent = v+"%";
    svg.appendChild(txt);
  });

  var accent = getComputedStyle(document.body).getPropertyValue('--accent-blue').trim() || "#2E5FE0";
  var path = document.createElementNS(svgNS,"path");
  path.setAttribute("d", pathD);
  path.setAttribute("fill","none");
  path.setAttribute("stroke", accent);
  path.setAttribute("stroke-width","2");
  path.setAttribute("stroke-linejoin","round");
  path.setAttribute("stroke-linecap","round");
  svg.appendChild(path);

  pts.forEach(function(p){
    var c = document.createElementNS(svgNS,"circle");
    c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r","3.5");
    c.setAttribute("fill", accent);
    var title = document.createElementNS(svgNS,"title");
    title.textContent = fmtDate(p.d.fecha)+" — "+p.d.porcentaje+"%";
    c.appendChild(title);
    svg.appendChild(c);

    if(n <= 14){
      var lbl = document.createElementNS(svgNS,"text");
      lbl.setAttribute("x", p.x); lbl.setAttribute("y", h-8);
      lbl.setAttribute("font-size","9"); lbl.setAttribute("fill","currentColor");
      lbl.setAttribute("opacity","0.5"); lbl.setAttribute("text-anchor","middle");
      lbl.setAttribute("font-family","IBM Plex Mono, monospace");
      var parts = p.d.fecha.split("-");
      lbl.textContent = parts[2]+"/"+parts[1];
      svg.appendChild(lbl);
    }
  });

  var box = el("div", {style:"color:var(--text);"});
  box.appendChild(svg);
  return box;
}

/* ================== RENDER: TEMARIO ================== */
function renderTemario(){
  var wrap = el("div");

  var panelImport = el("div", {class:"panel panel-pad"});
  panelImport.appendChild(el("div", {class:"grid grid-2"}, [
    (function(){
      var box = el("div");
      box.appendChild(el("div", {style:"font-weight:600;font-size:13px;margin-bottom:6px;"}, ["Importar Temarios_JSON.json"]));
      var inp = el("input", {type:"file", accept:".json"});
      inp.addEventListener("change", function(ev){
        var file = ev.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(){
          try{
            var data = JSON.parse(reader.result);
            if(!Array.isArray(data)) throw new Error("El JSON debe ser un array de temas");
            state.temas = data;
            saveTemas();
            toast("Importados "+data.length+" temas");
            render();
          }catch(err){
            toast("Error al importar: "+err.message);
          }
        };
        reader.readAsText(file);
      });
      box.appendChild(inp);
      box.appendChild(el("div", {class:"section-note"}, ["Reemplaza el temario actual completo por el contenido del archivo."]));
      return box;
    })(),
    (function(){
      var box = el("div");
      box.appendChild(el("div", {style:"font-weight:600;font-size:13px;margin-bottom:6px;"}, ["Exportar / gestionar"]));
      var row = el("div", {style:"display:flex;gap:8px;flex-wrap:wrap;"});
      row.appendChild(el("button", {class:"btn btn-ghost btn-sm", onclick:exportJSON}, ["Exportar JSON"]));
      row.appendChild(el("button", {class:"btn btn-ghost btn-sm", onclick:function(){ addTemaManual(); }}, ["+ Añadir tema"]));
      row.appendChild(el("button", {class:"btn btn-danger btn-sm", onclick:function(){
        if(confirm("¿Borrar todos los temas del temario? Esta acción no se puede deshacer.")){
          state.temas = []; saveTemas(); render();
        }
      }}, ["Borrar temario"]));
      box.appendChild(row);
      return box;
    })()
  ]));
  wrap.appendChild(panelImport);

  var panel = el("div", {class:"panel"});
  panel.appendChild(el("div", {class:"panel-head"}, [
    el("div", {}, [el("h2",{},["Temario ("+state.temas.length+")"])])
  ]));

  if(!state.temas.length){
    panel.appendChild(el("div", {class:"empty"}, ["No hay temas cargados. Importa tu JSON o añade uno manualmente."]));
  } else {
    var tw = el("div", {class:"table-wrap"});
    var tbl = el("table");
    tbl.appendChild(el("tr",{},[
      el("th",{},["#"]),el("th",{},["Título"]),el("th",{},["Bloque"]),el("th",{},["Nivel"]),
      el("th",{},["Estudiado"]),el("th",{},["Últ. repaso"]),el("th",{},["Test %"]),el("th",{},["Errores"]),el("th",{},[""])
    ]));
    state.temas.slice().sort(function(a,b){return a.numero-b.numero;}).forEach(function(t){
      var cbEst = el("input", {type:"checkbox"});
      cbEst.checked = !!t.estudiado;
      cbEst.addEventListener("change", function(){ t.estudiado = cbEst.checked; saveTemas(); render(); });

      var selBloque = el("select", {}, BLOQUES.map(function(b){ return el("option", {value:b, selected: t.bloque===b ? "selected":null}, [b]); }));
      selBloque.value = t.bloque;
      selBloque.addEventListener("change", function(){ t.bloque = selBloque.value; saveTemas(); });

      var selNivel = el("select", {}, [1,2,3,4].map(function(n){ return el("option", {value:n}, ["N"+n]); }));
      selNivel.value = t.nivel_prioridad;
      selNivel.addEventListener("change", function(){ t.nivel_prioridad = parseInt(selNivel.value,10); saveTemas(); render(); });

      var inpFecha = el("input", {type:"date", style:"min-width:130px;"});
      inpFecha.value = t.fecha_ultimo_repaso || "";
      inpFecha.addEventListener("change", function(){ t.fecha_ultimo_repaso = inpFecha.value || null; saveTemas(); render(); });

      var inpPct = el("input", {type:"number", min:"0", max:"100", style:"width:64px;"});
      inpPct.value = t.ultimo_porcentaje_test != null ? t.ultimo_porcentaje_test : "";
      inpPct.addEventListener("change", function(){ t.ultimo_porcentaje_test = inpPct.value!=="" ? parseFloat(inpPct.value) : null; saveTemas(); });

      tbl.appendChild(el("tr",{},[
        el("td",{class:"mono"},[String(t.numero)]),
        el("td",{},[t.titulo]),
        el("td",{},[selBloque]),
        el("td",{},[selNivel]),
        el("td",{},[cbEst]),
        el("td",{},[inpFecha]),
        el("td",{},[inpPct]),
        el("td",{class:"mono"},[String((t.cuaderno_errores||[]).length)]),
        el("td",{},[el("button", {class:"btn btn-danger btn-sm", onclick:function(){
          if(confirm("¿Eliminar el tema "+t.numero+"?")){
            state.temas = state.temas.filter(function(x){return x!==t;});
            saveTemas(); render();
          }
        }}, ["✕"])])
      ]));
    });
    tw.appendChild(tbl);
    panel.appendChild(tw);
  }
  wrap.appendChild(panel);
  return wrap;
}

function addTemaManual(){
  var titulo = prompt("Título del tema:");
  if(!titulo) return;
  var numero = (state.temas.reduce(function(m,t){return Math.max(m,t.numero||0);},0)) + 1;
  state.temas.push({
    numero: numero,
    titulo: titulo,
    bloque: "Bloque I",
    nivel_prioridad: 1,
    estudiado: false,
    fecha_ultimo_repaso: null,
    ultimo_porcentaje_test: null,
    cuaderno_errores: []
  });
  saveTemas();
  render();
}

function exportJSON(){
  var blob = new Blob([JSON.stringify(state.temas, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "Temarios_JSON.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("JSON exportado");
}

/* ================== CLOCK ================== */
function renderClock(){
  var now = new Date();
  var dia = DIA_NOMBRES[now.getDay()];
  var fecha = now.toLocaleDateString("es-ES", {day:"2-digit",month:"2-digit",year:"numeric"});
  var hora = now.toLocaleTimeString("es-ES", {hour:"2-digit",minute:"2-digit"});
  document.getElementById("clockBox").innerHTML = "<b>"+dia+"</b> · "+fecha+" · "+hora;
}

/* ================== THEME ================== */
function applyStoredTheme(){
  var t = localStorage.getItem(LS_THEME);
  if(t === "dark") document.documentElement.setAttribute("data-theme","dark");
  else if(t === "light") document.documentElement.setAttribute("data-theme","light");
}
document.getElementById("themeToggle").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(LS_THEME, next);
});
applyStoredTheme();

/* ================== MAIN RENDER ================== */
function render(){
  var view = document.getElementById("view");
  view.innerHTML = "";
  var content;
  if(state.tab === "dashboard") content = renderDashboard();
  else if(state.tab === "hoy") content = renderHoy();
  else if(state.tab === "dia5") content = renderDia5();
  else if(state.tab === "historial") content = renderHistorial();
  else content = renderTemario();
  view.appendChild(content);
}

renderClock();
setInterval(renderClock, 30000);
render();

})();
